<!doctype html>
<html><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#3a3a3a;font-family:-apple-system,Helvetica,sans-serif;padding:44px 30px}
  .row{display:flex;gap:80px;justify-content:center;align-items:flex-start}
  .col{text-align:center;color:#eee}
  .big{width:400px;height:400px;border-radius:90px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.55)}
  .minis{display:flex;gap:26px;justify-content:center;margin-top:22px;align-items:flex-end}
  .i{border-radius:22%;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.5)}
  .cap{color:#bbb;font-size:13px;margin-top:7px}
  .label{margin-top:18px;font-size:22px;font-weight:700}
  .sub{font-size:14px;color:#aaa;margin-top:3px;max-width:400px}
  svg{display:block;width:100%;height:100%}
  .dol{font-family:Arial,Helvetica,sans-serif;font-weight:800}
</style></head>
<body>
<div class="row">

  <!-- LEFT: plain polished V3 -->
  <div class="col">
    <div class="big"><svg viewBox="0 0 340 340" id="a">
      <defs>
        <radialGradient id="bgA" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#141a18"/><stop offset="100%" stop-color="#050807"/></radialGradient>
        <filter id="gA" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <rect width="340" height="340" fill="url(#bgA)"/>
      <g filter="url(#gA)">
        <path d="M64 106 H150 L210 166 V242 H276" fill="none" stroke="#2dff6a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
        <g transform="translate(64 106)"><circle r="35" fill="#070a09" stroke="#2dff6a" stroke-width="8"/><text class="dol" y="18" font-size="52" fill="#2dff6a" text-anchor="middle">$</text></g>
        <g transform="translate(210 166)"><circle r="35" fill="#070a09" stroke="#2dff6a" stroke-width="8"/><text class="dol" y="18" font-size="52" fill="#2dff6a" text-anchor="middle">$</text></g>
        <g transform="translate(276 242)"><circle r="35" fill="#070a09" stroke="#2dff6a" stroke-width="8"/><text class="dol" y="18" font-size="52" fill="#2dff6a" text-anchor="middle">$</text></g>
      </g>
    </svg></div>
    <div class="minis">
      <div><div class="i" style="width:100px;height:100px" id="a100"></div><div class="cap">100px</div></div>
      <div><div class="i" style="width:56px;height:56px" id="a56"></div><div class="cap">56px</div></div>
    </div>
    <div class="label">Plain V3</div>
    <div class="sub">Simple L-bends, 3 stops. What you have now.</div>
  </div>

  <!-- RIGHT: transit-bend version -->
  <div class="col">
    <div class="big"><svg viewBox="0 0 340 340" id="b">
      <defs>
        <radialGradient id="bgB" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#141a18"/><stop offset="100%" stop-color="#050807"/></radialGradient>
        <filter id="gB" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <rect width="340" height="340" fill="url(#bgB)"/>
      <g filter="url(#gB)">
        <!-- subway line: H, 45° diag, H, 45° diag, V -->
        <path d="M66 108 H116 L160 152 H206 L250 196 V236" fill="none" stroke="#2dff6a" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- minor stops (ticks) on the bends -->
        <circle cx="116" cy="108" r="10" fill="#2dff6a"/>
        <circle cx="160" cy="152" r="10" fill="#2dff6a"/>
        <!-- major $ stations -->
        <g transform="translate(66 108)"><circle r="33" fill="#070a09" stroke="#2dff6a" stroke-width="8"/><text class="dol" y="17" font-size="49" fill="#2dff6a" text-anchor="middle">$</text></g>
        <g transform="translate(206 152)"><circle r="33" fill="#070a09" stroke="#2dff6a" stroke-width="8"/><text class="dol" y="17" font-size="49" fill="#2dff6a" text-anchor="middle">$</text></g>
        <g transform="translate(250 236)"><circle r="33" fill="#070a09" stroke="#2dff6a" stroke-width="8"/><text class="dol" y="17" font-size="49" fill="#2dff6a" text-anchor="middle">$</text></g>
      </g>
    </svg></div>
    <div class="minis">
      <div><div class="i" style="width:100px;height:100px" id="b100"></div><div class="cap">100px</div></div>
      <div><div class="i" style="width:56px;height:56px" id="b56"></div><div class="cap">56px</div></div>
    </div>
    <div class="label">Transit-bend V3</div>
    <div class="sub">Real 45° subway bends, 3 “$” stations + 2 minor stops along the line.</div>
  </div>
</div>

<script>
  var a=document.getElementById('a'), b=document.getElementById('b');
  a100.appendChild(a.cloneNode(true)); a56.appendChild(a.cloneNode(true));
  b100.appendChild(b.cloneNode(true)); b56.appendChild(b.cloneNode(true));
</script>
</body></html>
